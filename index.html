<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lurkers.io Bedwars Leaderboard</title>
    <meta name="description" content="Live Lurkers.io Bedwars leaderboard with player scores, kills, deaths, wins and losses.">

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
        background: #0f1117;
        color: #e6e6e6;
    }

    h1 {
        text-align: center;
        color: #ffffff;
        margin-bottom: 8px;
    }

    #updated {
        text-align: center;
        color: #8b949e;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        border-radius: 12px;
        background: #161b22;
        border: 1px solid #30363d;
    }

    th {
        padding: 13px 10px;
        background: #21262d;
        color: #ffffff;
        border-bottom: 1px solid #30363d;
    }

    td {
        padding: 12px 10px;
        border-bottom: 1px solid #21262d;
        text-align: center;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover {
        background: #1f2630;
    }

    @font-face {
        font-family: "Lurkers";
        src: url("lurkers.ttf") format("truetype");
    }

    td:nth-child(2) {
        text-align: left;
        font-weight: bold;
        color: #ffffff;
        font-family: "Lurkers", sans-serif;
    }

    td:nth-child(3) {
        font-weight: bold;
    }

    .error {
        text-align: center;
        color: #ff6b6b;
    }

    @media (max-width: 700px) {
        body {
            padding: 20px 10px;
        }

        h1 {
            font-size: 24px;
        }

        table {
            font-size: 13px;
        }

        th, td {
            padding: 8px 5px;
        }
    tbody tr.rank-1 {
        border-left: 8px solid #ffd700;
    }

    tbody tr.rank-2 {
        border-left: 8px solid #e5e7eb;
    }

    tbody tr.rank-3 {
        border-left: 8px solid #ff8c42;
    }
</style>
</head>

<body>

<h1>Lurkers.io Bedwars Leaderboard</h1>

<div id="updated">Loading leaderboard...</div>

<table>
    <thead>
        <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Score</th>
            <th>Kills</th>
            <th>Deaths</th>
            <th>Games Won</th>
            <th>Games Lost</th>
        </tr>
    </thead>

    <tbody id="leaderboard">
    </tbody>
</table>

<script>
async function loadLeaderboard() {
    try {
        const response = await fetch("leaderboard.json?cache=" + Date.now());

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        const leaderboard = document.getElementById("leaderboard");
        leaderboard.innerHTML = "";

        data.players.forEach((player, index) => {
            const row = document.createElement("tr");

            if (index === 0) {
                row.classList.add("rank-1");
            } else if (index === 1) {
                row.classList.add("rank-2");
            } else if (index === 2) {
                row.classList.add("rank-3");
            }

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(player["Player Name"])}</td>
                <td>${player["Score"].toLocaleString()}</td>
                <td>${player["Kills"].toLocaleString()}</td>
                <td>${player["Deaths"].toLocaleString()}</td>
                <td>${player["Games Won"].toLocaleString()}</td>
                <td>${player["Games Lost"].toLocaleString()}</td>
            `;

            leaderboard.appendChild(row);
        });

        if (data.updatedAt) {
            const date = new Date(data.updatedAt);

            document.getElementById("updated").textContent =
                "Last fetched: " + date.toLocaleString();
        }

    } catch (error) {
        console.error(error);

        document.getElementById("updated").innerHTML =
            '<span class="error">Failed to load leaderboard.</span>';
    }
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

loadLeaderboard();
</script>

</body>
</html>
