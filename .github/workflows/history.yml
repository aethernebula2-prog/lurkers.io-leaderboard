name: Save Daily Leaderboard History

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-history:
    runs-on: ubuntu-latest

    steps:
      # 获取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 检查三个排行榜
      - name: Validate leaderboard data
        run: |
          for file in \
            leaderboard-bedwars.json \
            leaderboard-ctf.json \
            leaderboard-team-deathmatch.json
          do
            echo "Checking $file..."

            jq empty "$file"

            if [ "$(jq 'length' "$file")" -eq 0 ]; then
              echo "ERROR: $file is empty!"
              exit 1
            fi

            echo "$file is valid."
          done

      # 保存历史
      - name: Save today's history
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p history

          jq -n \
            --slurpfile bedwars leaderboard-bedwars.json \
            --slurpfile ctf leaderboard-ctf.json \
            --slurpfile tdm leaderboard-team-deathmatch.json \
            '{
              bedwars: $bedwars[0],
              ctf: $ctf[0],
              "team-deathmatch": $tdm[0]
            }' > "history/${DATE}.json"


      # 上传到 Filebase
      - name: Upload history to Filebase
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILEBASE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          aws --endpoint https://s3.filebase.io \
            s3 cp \
            "history/${DATE}.json" \
            "s3://lurkersio-leaderboard-history/${DATE}.json"
