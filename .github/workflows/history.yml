name: Save Daily Leaderboard History

on:
  schedule:
    - cron: "0 3 * * *"

  # 允许手动运行，方便测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-history:
    runs-on: ubuntu-latest

    steps:
      # 获取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 检查三个排行榜
      - name: Validate leaderboard data
        run: |
          for file in \
            data/leaderboard-bedwars.json \
            data/leaderboard-ctf.json \
            data/leaderboard-team-deathmatch.json
          do
            echo "Checking $file..."

            # 检查 JSON 是否有效
            jq empty "$file"

            # 检查是否为空
            if [ "$(jq 'length' "$file")" -eq 0 ]; then
              echo "ERROR: $file is empty!"
              exit 1
            fi

            echo "$file is valid."
          done

      # 保存历史
      - name: Save today's history
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          mkdir -p history

          jq -n \
            --slurpfile bedwars data/leaderboard-bedwars.json \
            --slurpfile ctf data/leaderboard-ctf.json \
            --slurpfile tdm data/leaderboard-team-deathmatch.json \
            '{
              bedwars: $bedwars[0],
              ctf: $ctf[0],
              "team-deathmatch": $tdm[0]
            }' > "history/${DATE}.json"

      # 提交到 GitHub
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Save daily leaderboard history"
          git push
